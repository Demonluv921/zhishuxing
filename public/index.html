<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智刷星 · AI 专业课智能刷题平台</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="login-root"></div>
  <div id="app-root" class="hidden">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon">✨</span>
        <div>
          <div class="brand-name">智刷星</div>
          <div class="brand-sub">AI 学习伙伴</div>
        </div>
      </div>
      <nav class="nav">
        <a href="#/dashboard" class="nav-item" data-nav="dashboard"><span>🏠</span> 学习台</a>
        <a href="#/courses" class="nav-item" data-nav="courses"><span>📚</span> 全部课程</a>
        <a href="#/history" class="nav-item" data-nav="history"><span>📊</span> 诊断记录</a>
        <a href="#/ai" class="nav-item" data-nav="ai"><span>🤖</span> AI 出题</a>
        <a href="#/tutor" class="nav-item" data-nav="tutor"><span>💬</span> AI 讲题</a>
        <a href="#/mock-exam" class="nav-item" data-nav="mock-exam"><span>📝</span> 模拟卷</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="avatar" id="user-avatar">学</div>
          <div class="user-meta">
            <div id="user-name">同学</div>
            <div id="user-school">华中科技大学</div>
          </div>
        </div>
        <button class="btn btn-ghost btn-sm full" id="logout-btn">退出登录</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="page-title">学习台</h1>
          <p id="page-subtitle">期末复习的 AI 智能伙伴</p>
        </div>
        <div class="topbar-right">
          <span class="ai-badge" id="ai-status"><span class="dot"></span> AI 检测中…</span>
        </div>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>
  <div id="toast-root"></div>
  <script src="/js/api.js"></script>
  <script src="/js/graph.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
