<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智刷星 · AI 专业课智能刷题平台</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
  <meta name="description" content="智刷星 - 基于 DeepSeek 大模型的 AI 专业课智能刷题平台,知识图谱诊断薄弱点、个性化复习路径、苏格拉底式讲题">
  <style>:root {
  --bg: #f4f6fb;
  --card: #ffffff;
  --ink: #1e2433;
  --muted: #6b7280;
  --line: #e5e9f2;
  --brand: #4f46e5;
  --brand-dark: #4338ca;
  --brand-soft: #eef2ff;
  --green: #059669;
  --green-soft: #ecfdf5;
  --amber: #d97706;
  --amber-soft: #fffbeb;
  --red: #dc2626;
  --red-soft: #fef2f2;
  --gray: #9ca3af;
  --gray-soft: #f3f4f6;
  --radius: 14px;
  --shadow: 0 1px 3px rgba(16, 24, 40, .06), 0 8px 24px -12px rgba(16, 24, 40, .12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.6;
}
.hidden { display: none !important; }
a { color: var(--brand); text-decoration: none; }
button { font-family: inherit; }

/* ---------- 布局 ---------- */
#app-root { display: flex; min-height: 100vh; }
.sidebar {
  width: 232px;
  flex-shrink: 0;
  background: #161a2e;
  color: #cbd2e9;
  display: flex;
  flex-direction: column;
  padding: 20px 14px;
  position: sticky;
  top: 0;
  height: 100vh;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; border-bottom: 1px solid rgba(255,255,255,.08); }
.brand-icon { font-size: 26px; }
.brand-name { font-size: 19px; font-weight: 700; color: #fff; letter-spacing: 1px; }
.brand-sub { font-size: 11px; color: #8b93b8; }
.nav { flex: 1; margin-top: 16px; display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 10px;
  color: #cbd2e9; font-size: 14px;
  transition: background .15s, color .15s;
}
.nav-item:hover { background: rgba(255,255,255,.07); color: #fff; }
.nav-item.active { background: var(--brand); color: #fff; font-weight: 600; }
.sidebar-footer { border-top: 1px solid rgba(255,255,255,.08); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.user-chip { display: flex; align-items: center; gap: 10px; padding: 4px 8px; }
.avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, #6366f1, #a855f7);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 700; flex-shrink: 0;
}
.user-meta { overflow: hidden; }
.user-meta div:first-child { font-size: 13px; color: #fff; font-weight: 600; white-space: nowrap; }
.user-meta div:last-child { font-size: 11px; color: #8b93b8; white-space: nowrap; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 22px 32px 12px;
}
.topbar h1 { font-size: 22px; font-weight: 700; }
.topbar p { font-size: 13px; color: var(--muted); margin-top: 2px; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.ai-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--brand-soft); color: var(--brand-dark);
  font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px;
}
.ai-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; }
.ai-badge.off { background: var(--gray-soft); color: var(--muted); }
.ai-badge.off .dot { background: #d1d5db; }

.view { padding: 12px 32px 48px; }

/* ---------- 卡片 ---------- */
.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 22px;
}
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 1100px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } .grid-3 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 720px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } .sidebar { display: none; } .view, .topbar { padding-left: 16px; padding-right: 16px; } }

.stat-card { display: flex; align-items: center; gap: 14px; }
.stat-icon {
  width: 46px; height: 46px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center; font-size: 22px;
  flex-shrink: 0;
}
.stat-value { font-size: 24px; font-weight: 800; line-height: 1.2; }
.stat-label { font-size: 12px; color: var(--muted); }

.course-card {
  cursor: pointer; transition: transform .15s, box-shadow .15s;
  position: relative; overflow: hidden;
}
.course-card:hover { transform: translateY(-3px); box-shadow: 0 12px 30px -12px rgba(16,24,40,.25); }
.course-card .course-icon { font-size: 34px; }
.course-card h3 { font-size: 17px; margin: 10px 0 4px; }
.course-card p { font-size: 12.5px; color: var(--muted); min-height: 40px; }
.course-meta { display: flex; gap: 12px; margin-top: 12px; font-size: 12px; color: var(--muted); }
.course-meta span { background: var(--gray-soft); padding: 3px 10px; border-radius: 999px; }

.section-title { font-size: 16px; font-weight: 700; margin: 26px 0 12px; display: flex; align-items: center; gap: 8px; }

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: none; cursor: pointer; border-radius: 10px;
  padding: 10px 18px; font-size: 14px; font-weight: 600;
  transition: filter .15s, transform .1s, background .15s;
  background: var(--brand); color: #fff;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-secondary { background: var(--brand-soft); color: var(--brand-dark); }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.btn-danger { background: var(--red-soft); color: var(--red); }
.btn-success { background: var(--green); color: #fff; }
.btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
.full { width: 100%; }
.btn-block { width: 100%; margin-top: 18px; }

/* ---------- 表单 ---------- */
.input, .select, textarea {
  width: 100%; padding: 10px 14px; border: 1px solid var(--line);
  border-radius: 10px; font-size: 14px; font-family: inherit;
  background: #fff; color: var(--ink); outline: none;
  transition: border .15s, box-shadow .15s;
}
.input:focus, .select:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #374151; }
.field .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* ---------- 登录 ---------- */
.login-wrap {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(1200px 600px at 20% -10%, #312e81 0%, #1e1b4b 45%, #0f172a 100%);
  padding: 20px;
}
.login-card { width: 400px; background: #fff; border-radius: 18px; padding: 36px; box-shadow: 0 24px 60px -20px rgba(0,0,0,.5); }
.login-logo { font-size: 42px; text-align: center; }
.login-title { text-align: center; font-size: 24px; font-weight: 800; margin-top: 8px; }
.login-sub { text-align: center; color: var(--muted); font-size: 13px; margin: 4px 0 24px; }
.tabs { display: flex; background: var(--gray-soft); border-radius: 10px; padding: 4px; margin-bottom: 20px; }
.tabs button {
  flex: 1; border: none; background: transparent; padding: 8px; border-radius: 8px;
  font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer;
}
.tabs button.active { background: #fff; color: var(--brand-dark); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.login-tip { margin-top: 16px; font-size: 12px; color: var(--muted); text-align: center; }
.error-text { color: var(--red); font-size: 13px; margin-top: 8px; display: none; }

/* ---------- 诊断 ---------- */
.quiz-wrap { max-width: 760px; margin: 0 auto; }
.quiz-progress { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.progress-track { flex: 1; height: 8px; background: var(--gray-soft); border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--brand), #8b5cf6); border-radius: 99px; transition: width .3s; }
.quiz-count { font-size: 13px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.quiz-card { background: #fff; border-radius: var(--radius); padding: 30px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.quiz-kp-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.kp-tag { background: var(--brand-soft); color: var(--brand-dark); font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
.quiz-stem { font-size: 17px; font-weight: 600; line-height: 1.7; margin-bottom: 20px; }
.option {
  display: flex; align-items: flex-start; gap: 12px;
  border: 1.5px solid var(--line); border-radius: 12px;
  padding: 13px 16px; margin-bottom: 10px; cursor: pointer;
  transition: border .15s, background .15s;
  font-size: 14.5px;
}
.option:hover { border-color: #a5b4fc; background: #fafaff; }
.option.selected { border-color: var(--brand); background: var(--brand-soft); font-weight: 600; }
.option .opt-letter { font-weight: 800; color: var(--brand); width: 20px; flex-shrink: 0; }
.option.correct { border-color: var(--green); background: var(--green-soft); }
.option.wrong { border-color: var(--red); background: var(--red-soft); }
.option.reveal-correct { border-color: var(--green); background: var(--green-soft); }

/* ---------- 结果页 ---------- */
.result-hero { text-align: center; padding: 34px 22px; }
.score-ring {
  width: 150px; height: 150px; margin: 0 auto 18px; position: relative;
}
.score-ring svg { transform: rotate(-90deg); }
.score-ring .score-text {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.score-text .num { font-size: 40px; font-weight: 800; line-height: 1; }
.score-text .unit { font-size: 12px; color: var(--muted); margin-top: 4px; }
.level-pill { display: inline-block; padding: 5px 16px; border-radius: 999px; font-size: 13px; font-weight: 700; }
.level-good { background: var(--green-soft); color: var(--green); }
.level-mid { background: var(--amber-soft); color: var(--amber); }
.level-low { background: var(--red-soft); color: var(--red); }
.result-summary { max-width: 620px; margin: 16px auto 0; color: var(--muted); font-size: 14px; }

.legend { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend .item { display: flex; align-items: center; gap: 6px; }
.legend .swatch { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }

.path-list { list-style: none; }
.path-list li {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px;
  margin-bottom: 10px; background: #fff;
}
.path-index {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--brand-soft); color: var(--brand-dark);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; flex-shrink: 0;
}
.path-reason { font-size: 12px; color: var(--muted); }

/* ---------- 练习 ---------- */
.practice-layout { display: grid; grid-template-columns: 1fr 300px; gap: 18px; align-items: start; }
@media (max-width: 980px) { .practice-layout { grid-template-columns: 1fr; } }
.qnav { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.qnav button {
  aspect-ratio: 1; border-radius: 8px; border: 1.5px solid var(--line);
  background: #fff; cursor: pointer; font-weight: 700; font-size: 13px;
}
.qnav button.done-correct { background: var(--green-soft); border-color: var(--green); color: var(--green); }
.qnav button.done-wrong { background: var(--red-soft); border-color: var(--red); color: var(--red); }
.qnav button.current { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79,70,229,.15); }
.feedback-box {
  margin-top: 16px; border-radius: 12px; padding: 16px;
  font-size: 14px; border: 1px solid;
}
.feedback-box.correct { background: var(--green-soft); border-color: #a7f3d0; }
.feedback-box.wrong { background: var(--red-soft); border-color: #fecaca; }
.feedback-box .fb-title { font-weight: 700; margin-bottom: 6px; }
.fb-actions { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- AI 出题 ---------- */
.ai-question {
  border: 1px solid var(--line); border-radius: 14px; padding: 20px;
  margin-bottom: 14px; background: #fff;
}
.ai-q-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.ai-q-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 11px; padding: 3px 10px; border-radius: 999px; font-weight: 600; }
.tag-kp { background: var(--brand-soft); color: var(--brand-dark); }
.tag-diff-easy { background: var(--green-soft); color: var(--green); }
.tag-diff-medium { background: var(--amber-soft); color: var(--amber); }
.tag-diff-hard { background: var(--red-soft); color: var(--red); }
.ai-q-stem { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
.ai-opt { display: flex; gap: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; font-size: 14px; }
.ai-opt.correct-opt { border-color: var(--green); background: var(--green-soft); }
.ai-explain { margin-top: 12px; font-size: 13.5px; color: #374151; background: var(--gray-soft); border-radius: 10px; padding: 12px; }
.ai-explain b { color: var(--brand-dark); }

/* ---------- 讲题聊天 ---------- */
.chat-layout { display: grid; grid-template-columns: 260px 1fr; gap: 18px; align-items: start; }
@media (max-width: 900px) { .chat-layout { grid-template-columns: 1fr; } }
.chat-box {
  background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); display: flex; flex-direction: column; height: 560px;
}
.chat-msgs { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 80%; padding: 12px 16px; border-radius: 14px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; }
.msg.user { align-self: flex-end; background: var(--brand); color: #fff; border-bottom-right-radius: 4px; }
.msg.ai { align-self: flex-start; background: var(--gray-soft); border-bottom-left-radius: 4px; }
.msg.loading { color: var(--muted); font-style: italic; }
.chat-input-row { display: flex; gap: 10px; padding: 14px; border-top: 1px solid var(--line); }
.chat-input-row textarea { flex: 1; resize: none; height: 52px; }
.chat-courses { display: flex; flex-direction: column; gap: 8px; }
.course-opt {
  border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px;
  cursor: pointer; font-size: 14px; background: #fff; text-align: left;
  display: flex; align-items: center; gap: 10px; transition: border .15s, background .15s;
}
.course-opt:hover { border-color: #a5b4fc; }
.course-opt.active { border-color: var(--brand); background: var(--brand-soft); font-weight: 600; }
.socratic-note { font-size: 12px; color: var(--muted); margin-top: 12px; }

/* ---------- 历史 / 表格 ---------- */
.table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.table th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.table td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tr:last-child td { border-bottom: none; }
.mini-score { font-weight: 800; font-size: 15px; }

/* ---------- Toast ---------- */
#toast-root { position: fixed; top: 20px; right: 20px; z-index: 999; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: #1f2937; color: #fff; font-size: 13.5px;
  padding: 12px 18px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.25);
  animation: slideIn .25s ease;
  max-width: 340px;
}
.toast.error { background: #b91c1c; }
.toast.success { background: #047857; }
@keyframes slideIn { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }

.loading-block { text-align: center; padding: 60px 20px; color: var(--muted); }
.spinner {
  width: 34px; height: 34px; border: 3px solid var(--brand-soft);
  border-top-color: var(--brand); border-radius: 50%;
  animation: spin .8s linear infinite; margin: 0 auto 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; }
.empty .emoji { font-size: 40px; margin-bottom: 10px; }

.ai-intro {
  background: linear-gradient(135deg, #eef2ff, #faf5ff);
  border: 1px solid #ddd6fe; border-radius: var(--radius);
  padding: 20px 24px; margin-bottom: 18px;
}
.ai-intro h3 { font-size: 15px; margin-bottom: 4px; }
.ai-intro p { font-size: 13px; color: #57534e; }

.exam-intro { text-align: center; padding: 40px 24px; }
.exam-intro .big { font-size: 46px; }
.exam-intro h2 { margin: 12px 0 6px; }
.exam-intro p { color: var(--muted); font-size: 14px; max-width: 520px; margin: 0 auto 20px; }
.exam-config { max-width: 560px; margin: 0 auto; }
.danger-text { color: var(--red); }

/* 静态版补充样式 */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(15, 23, 42, .55);
  display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px;
}
.modal {
  background: #fff; border-radius: 16px; padding: 26px; width: 440px; max-width: 100%;
  box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .4);
}
.modal h3 { font-size: 17px; margin-bottom: 8px; }
.modal-desc { font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.7; }
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(1200px 600px at 20% -10%, #312e81 0%, #1e1b4b 45%, #0f172a 100%); padding: 20px; }
.login-card { width: 400px; background: #fff; border-radius: 18px; padding: 36px; box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .5); }
.login-logo { font-size: 42px; text-align: center; }
.login-title { text-align: center; font-size: 24px; font-weight: 800; margin-top: 8px; }
.login-sub { text-align: center; color: var(--muted); font-size: 13px; margin: 4px 0 24px; }
.tabs { display: flex; background: var(--gray-soft); border-radius: 10px; padding: 4px; margin-bottom: 20px; }
.tabs button { flex: 1; border: none; background: transparent; padding: 8px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; }
.tabs button.active { background: #fff; color: var(--brand-dark); box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }
.login-tip { margin-top: 16px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.7; }
.error-text { color: var(--red); font-size: 13px; margin-top: 8px; display: none; }
</style>
</head>

// 简易密码哈希(scrypt 不可用时的浏览器端替代)
async function hashPassword(password, salt) {
  const data = new TextEncoder().encode(salt + '::' + password + '::zhishuxing');
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function randomSalt() {
  const arr = new Uint8Array(12);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
}

  // ===== 薄弱点诊断引擎(与后端版同算法,纯客户端) =====
function diagnoseAnswers(course, kpMap, answeredQuestions) {
  const stats = {};
  for (const kp of course.kps) stats[kp.id] = { correct: 0, total: 0, kp };
  for (const a of answeredQuestions) {
    for (const kpId of a.kpIds) {
      if (!stats[kpId]) continue;
      stats[kpId].total++;
      if (a.correct) stats[kpId].correct++;
    }
  }

  const PRIOR = 0.55, STRENGTH = 2.0;
  const mastery = {}, weak = [], strong = [];
  for (const kp of course.kps) {
    const s = stats[kp.id];
    if (!s.total) {
      mastery[kp.id] = { score: Math.round(PRIOR * 100), level: 'unknown', evidence: 0, accuracy: null };
      weak.push({ kp, evidence: 0 });
      continue;
    }
    const acc = s.correct / s.total;
    const shrunk = (s.correct + STRENGTH * PRIOR) / (s.total + STRENGTH);
    const score = Math.round(Math.min(1, Math.max(0, shrunk)) * 100);
    const level = score >= 75 ? 'mastered' : score >= 55 ? 'developing' : 'weak';
    mastery[kp.id] = { score, level, evidence: s.total, accuracy: Math.round(acc * 100) };
    if (level === 'weak') weak.push({ kp, evidence: s.total });
    else if (level === 'mastered') strong.push({ kp, evidence: s.total });
  }

  weak.sort((a, b) => a.kp.sort_order - b.kp.sort_order);
  strong.sort((a, b) => b.kp.weight - a.kp.weight);

  const correctCount = answeredQuestions.filter(a => a.correct).length;
  const score = Math.round(correctCount / (answeredQuestions.length || 1) * 100);

  const report = {
    summary: buildSummary(score, weak.length, course.kps.length),
    weakPoints: weak.slice(0, 5).map(w => ({ id: w.kp.id, name: w.kp.name, score: mastery[w.kp.id].score, evidence: w.evidence })),
    strongPoints: strong.slice(0, 5).map(s => ({ id: s.kp.id, name: s.kp.name, score: mastery[s.kp.id].score })),
    path: buildReviewPath(course, kpMap, weak.slice(0, 3).map(w => w.kp))
  };
  return { score, correctCount, totalCount: answeredQuestions.length, mastery, report };
}

function buildSummary(score, weakCount, totalKp) {
  if (score >= 80) return `整体掌握情况良好(得分 ${score} 分),仅 ${weakCount} 个知识点需要巩固。建议保持节奏,重点挑战综合题与易错题。`;
  if (score >= 60) return `整体处于中等水平(得分 ${score} 分),有 ${weakCount}/${totalKp} 个知识点存在薄弱环节。建议按推荐路径逐个击破。`;
  return `诊断显示 ${weakCount}/${totalKp} 个知识点掌握不足(得分 ${score} 分)。不必焦虑——按下方路径从最基础的知识点开始即可。`;
}

function buildReviewPath(course, kpMap, weakKps) {
  if (!weakKps.length) {
    return [...course.kps].sort((a, b) => b.weight - a.weight).slice(0, 3)
      .map(kp => ({ id: kp.id, name: kp.name, reason: '巩固优势,挑战更高阶综合题' }));
  }
  const path = [], seen = new Set();
  for (const kp of weakKps) {
    for (const e of course.edges || []) {
      if (e[1] === kp.name) {
        const p = course.kps.find(k => k.name === e[0]);
        if (p && !seen.has(p.id)) {
          seen.add(p.id);
          path.push({ id: p.id, name: p.name, reason: `${kp.name} 的前置基础` });
        }
      }
    }
    if (!seen.has(kp.id)) {
      seen.add(kp.id);
      path.push({ id: kp.id, name: kp.name, reason: '当前薄弱点,优先攻克' });
    }
  }
  return path;
}

const TUTOR_SYSTEM = `你是"智刷星"平台上的 AI 学习伙伴,采用苏格拉底式教学法帮助大学生理解专业课难题。

function extractJson(text) {
  let t = String(text).trim();
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (fence) t = fence[1].trim();
  const start = t.indexOf('{'), end = t.lastIndexOf('}');
  if (start >= 0 && end > start) t = t.slice(start, end + 1);
  return JSON.parse(t);
}

function normalizeQuestions(list) {
  return list.map((q, i) => {
    const ci = Number(q.correctIndex);
    const validCi = Number.isInteger(ci) && ci >= 0 && ci <= 3 ? ci : 0;
    const options = Array.isArray(q.options) && q.options.length >= 4
      ? q.options.slice(0, 4).map(o => String(o))
      : ['选项 A', '选项 B', '选项 C', '选项 D'];
    return {
      stem: String(q.stem || `第 ${i + 1} 题`),
      options,
      correctIndex: validCi,
      explanation: String(q.explanation || '本题考查了对应知识点的核心概念。'),
      kpName: String(q.kpName || '综合'),
      difficulty: ['easy', 'medium', 'hard'].includes(q.difficulty) ? q.difficulty : 'medium'
    };
  }).slice(0, 5);
}

  // ===== 知识图谱 SVG 渲染(力导向布局) =====
function renderKnowledgeGraph(container, course, mastery, practiceStats) {
  const nodes = course.kps.map(kp => ({ id: kp.id, name: kp.name, weight: kp.weight || 1 }));
  const edges = (course.edges || []).map(e => {
    const s = course.kps.find(k => k.name === e[0]);
    const t = course.kps.find(k => k.name === e[1]);
    return s && t ? { source: s.id, target: t.id } : null;
  }).filter(Boolean);
  const practice = {};
  (practiceStats || []).forEach(s => { practice[s.kp_id] = s.acc; });

  const W = 820, H = 460, cx = W / 2, cy = H / 2;
  nodes.forEach((n, i) => {
    const angle = (i / Math.max(nodes.length, 1)) * Math.PI * 2 - Math.PI / 2;
    const radius = Math.min(W, H) * 0.32 + (n.weight || 1) * 12;
    n.x = cx + Math.cos(angle) * radius;
    n.y = cy + Math.sin(angle) * radius;
    n.vx = 0; n.vy = 0;
  });

  for (let iter = 0; iter < 220; iter++) {
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        let dx = a.x - b.x, dy = a.y - b.y;
        let d = Math.sqrt(dx * dx + dy * dy) || 1;
        const force = 2400 / (d * d);
        dx /= d; dy /= d;
        a.vx += dx * force; a.vy += dy * force;
        b.vx -= dx * force; b.vy -= dy * force;
      }
    }
    for (const e of edges) {
      const a = nodes.find(n => n.id === e.source), b = nodes.find(n => n.id === e.target);
      if (!a || !b) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const force = (d - 90) * 0.04;
      a.vx += (dx / d) * force; a.vy += (dy / d) * force;
      b.vx -= (dx / d) * force; b.vy -= (dy / d) * force;
    }
    for (const n of nodes) {
      n.vx *= 0.82; n.vy *= 0.82;
      n.x += n.vx; n.y += n.vy;
      n.x = Math.max(48, Math.min(W - 48, n.x));
      n.y = Math.max(40, Math.min(H - 40, n.y));
    }
  }

  const colors = { weak: '#dc2626', developing: '#d97706', mastered: '#059669', unknown: '#9ca3af' };
  const labels = { weak: '薄弱', developing: '待加强', mastered: '掌握', unknown: '未诊断' };
  const levels = {};
  nodes.forEach(n => {
    let level = 'unknown';
    if (mastery && mastery[n.id]) level = mastery[n.id].level;
    else if (practice[n.id] != null) level = practice[n.id] >= 0.6 ? 'mastered' : practice[n.id] >= 0.4 ? 'developing' : 'weak';
    levels[n.id] = level;
  });

  const svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;background:#fafbff;border-radius:12px;border:1px solid #e5e9f2">
    <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c7cddd"/></marker></defs>
    ${edges.map(e => {
      const a = nodes.find(n => n.id === e.source), b = nodes.find(n => n.id === e.target);
      return a && b ? `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#c7cddd" stroke-width="1.6" marker-end="url(#arrow)"/>` : '';
    }).join('')}
    ${nodes.map(n => {
      const r = 22 + (n.weight || 1) * 4;
      const c = colors[levels[n.id]] || colors.unknown;
      const score = mastery && mastery[n.id] ? `<text x="${n.x}" y="${n.y - r - 6}" text-anchor="middle" font-size="11" font-weight="800" fill="${c}">${mastery[n.id].score}分</text>` : '';
      return `<g><circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${c}" fill-opacity="0.12" stroke="${c}" stroke-width="2.2"/><circle cx="${n.x}" cy="${n.y}" r="6" fill="${c}"/><text x="${n.x}" y="${n.y + r + 14}" text-anchor="middle" font-size="12.5" font-weight="600" fill="#374151">${esc(n.name)}</text>${score}</g>`;
    }).join('')}
  </svg>`;

  const legend = Object.keys(colors).map(k => `<span class="item"><span class="swatch" style="background:${colors[k]}"></span>${labels[k]}</span>`).join('');
  container.innerHTML = `<div style="margin-bottom:12px">${svg}</div><div class="legend">${legend}</div>`;
}

  state.courses = buildCourses(SEED);

// 把 seed 数据(知识点名/题)转为带 id 的结构
function buildCourses(seed) {
  return seed.map(c => {
    const kps = c.kps.map((k, i) => ({ ...k, id: i + 1, sort_order: i }));
    const kpIdByName = {};
    kps.forEach(k => { kpIdByName[k.name] = k.id; });
    const questions = c.questions.map((q, i) => ({
      ...q,
      id: i + 1,
      courseId: 0,
      kpIds: q.kps.map(name => kpIdByName[name]).filter(Boolean)
    }));
    return { ...c, id: 0, kps, questions, edges: c.edges || [] };
  }).map((c, i) => ({
    ...c,
    id: i + 1,
    questions: c.questions.map(q => ({ ...q, courseId: i + 1 }))
  }));
}

function kpName(course, id) {
  const kp = (course.kps || []).find(k => k.id === id);
  return kp ? kp.name : '综合';
}

async function doLogin() {
  const account = document.getElementById('login-account').value.trim();
  const password = document.getElementById('login-password').value;
  const err = document.getElementById('login-error');
  err.style.display = 'none';
  const user = Store.users.find(account);
  if (!user) { err.textContent = '账号不存在,请先注册'; err.style.display = 'block'; return; }
  const hash = await hashPassword(password, user.salt);
  if (hash !== user.passHash) { err.textContent = '密码错误'; err.style.display = 'block'; return; }
  state.user = user;
  Store.session.set({ id: user.id, name: user.name, account: user.account });
  showApp();
}

async function doRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const account = document.getElementById('reg-account').value.trim();
  const password = document.getElementById('reg-password').value;
  const err = document.getElementById('register-error');
  err.style.display = 'none';
  if (!name || !account || password.length < 6) { err.textContent = '请填写完整信息,密码至少 6 位'; err.style.display = 'block'; return; }
  if (Store.users.find(account)) { err.textContent = '该账号已注册'; err.style.display = 'block'; return; }
  const salt = randomSalt();
  const user = { id: Date.now() % 1000000000, name, account, salt, passHash: await hashPassword(password, salt) };
  Store.users.add(user);
  state.user = user;
  Store.session.set({ id: user.id, name: user.name, account: user.account });
  toast('注册成功,欢迎使用智刷星!', 'success');
  showApp();
}

function route() {
  if (!state.user) return;
  const hash = location.hash.replace(/^#\/?/, '') || 'dashboard';
  const parts = hash.split('?')[0].split('/');
  const page = parts[0];
  const meta = PAGES[page];
  if (meta) {
    document.getElementById('page-title').textContent = meta.title;
    document.getElementById('page-subtitle').textContent = meta.sub;
  }
  document.querySelectorAll('.nav-item').forEach(a => a.classList.toggle('active', a.dataset.nav === page));
  const view = document.getElementById('view');
  view.innerHTML = '<div class="loading-block"><div class="spinner"></div>加载中…</div>';
  try {
    if (page === 'dashboard') renderDashboard(view);
    else if (page === 'courses') renderCourses(view);
    else if (page === 'history') renderHistory(view);
    else if (page === 'ai') renderAiPage(view);
    else if (page === 'tutor') renderTutorPage(view);
    else if (page === 'mock-exam') renderMockExamPage(view);
    else if (page === 'about') renderAbout(view);
    else if (page === 'diagnostic') renderDiagnostic(view, Number(parts[1]));
    else if (page === 'result') renderResult(view, Number(parts[1]));
    else if (page === 'practice') renderPractice(view, Number(parts[1]), Number(parts[2] || 0));
    else if (page === 'course') renderCourseDetail(view, Number(parts[1]));
    else view.innerHTML = '<div class="empty"><div class="emoji">🧭</div>页面不存在</div>';
  } catch (e) {
    view.innerHTML = `<div class="empty"><div class="emoji">⚠️</div><div>${esc(e.message)}</div></div>`;
  }
}

/* ================= 诊断 ================= */
function renderDiagnostic(view, courseId) {
  const course = state.courses.find(x => x.id === courseId);
  if (!course) throw new Error('课程不存在');
  const all = course.questions.map((q, i) => ({ ...q, seq: i }));
  const picked = [];
  const covered = new Set();
  // 贪心全覆盖 + 随机补齐
  while (picked.length < 10 && all.length) {
    let best = null, gain = -1;
    for (const q of all) {
      if (picked.includes(q)) continue;
      const g = q.kpIds.filter(id => !covered.has(id)).length;
      if (g > gain) { gain = g; best = q; }
    }
    if (best && gain > 0 && picked.length < Math.min(course.kps.length, 8)) {
      picked.push(best);
      best.kpIds.forEach(id => covered.add(id));
    } else {
      const rest = all.filter(q => !picked.includes(q));
      if (!rest.length) break;
      const q = rest[Math.floor(Math.random() * rest.length)];
      picked.push(q);
      q.kpIds.forEach(id => covered.add(id));
    }
  }
  state.quiz = { courseId, questions: picked.slice(0, 10), index: 0, answers: [] };
  renderQuizStep(view, course);
}

function renderQuizStep(view, course) {
  const qz = state.quiz;
  if (qz.index >= qz.questions.length) { finishDiagnostic(); return; }
  const q = qz.questions[qz.index];
  view.innerHTML = `
    <div class="quiz-wrap">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px"><a class="btn btn-sm btn-ghost" href="#/course/${course.id}">← 返回</a><div style="font-weight:700;font-size:15px">${course.icon} ${esc(course.name)} · 知识点诊断</div></div>
      <div class="quiz-progress"><div class="progress-track"><div class="progress-fill" style="width:${(qz.index / 10 * 100).toFixed(0)}%"></div></div><div class="quiz-count">${qz.index + 1} / 10</div></div>
      <div class="quiz-card">
        <div class="quiz-kp-tags">${q.kpIds.map(id => `<span class="kp-tag">${esc(kpName(course, id))}</span>`).join('')}</div>
        <div class="quiz-stem">${esc(q.stem)}</div>
        ${q.options.map((opt, i) => `<div class="option" data-index="${i}"><span class="opt-letter">${String.fromCharCode(65 + i)}.</span><span>${esc(opt)}</span></div>`).join('')}
        <button class="btn btn-block" id="quiz-next" disabled>确认作答,下一题</button>
      </div>
    </div>`;
  let selected = null;
  view.querySelectorAll('.option').forEach(el => {
    el.onclick = () => {
      view.querySelectorAll('.option').forEach(x => x.classList.remove('selected'));
      el.classList.add('selected');
      selected = Number(el.dataset.index);
      document.getElementById('quiz-next').disabled = false;
    };
  });
  document.getElementById('quiz-next').onclick = () => {
    qz.answers.push({ questionId: q.id, selected, kpIds: q.kpIds, correct: selected === q.correctIndex });
    qz.index++;
    renderQuizStep(view, course);
  };
}

function finishDiagnostic() {
  const qz = state.quiz;
  const course = state.courses.find(c => c.id === qz.courseId);
  const result = diagnoseAnswers(course, {}, qz.answers);
  const data = userData();
  const record = {
    id: Date.now(),
    courseId: qz.courseId,
    courseName: course.name,
    createdAt: new Date().toISOString(),
    ...result
  };
  data.results = data.results || [];
  data.results.push(record);
  saveUserData(data);
  state.quiz = null;
  toast('诊断完成!正在生成分析报告…', 'success');
  location.hash = '#/result/' + record.id;
}

/* ================= 练习 ================= */
function renderPractice(view, courseId, kpId) {
  const course = state.courses.find(c => c.id === courseId);
  if (!course) throw new Error('课程不存在');
  const pool = kpId ? course.questions.filter(q => q.kpIds.includes(kpId)) : course.questions;
  if (!pool.length) { view.innerHTML = `<div class="empty"><div class="emoji">📭</div>该知识点暂无题目,试试 <a href="#/ai?course=${courseId}${kpId ? '&kp=' + kpId : ''}">AI 出题</a></div>`; return; }
  const questions = shuffle(pool).slice(0, kpId ? 8 : 12).map(q => ({ ...q, selected: null, done: false }));
  state.practice = { courseId, kpId, questions, index: 0 };
  renderPracticeQuestion(view, course);
}

function renderPracticeQuestion(view, course) {
  const p = state.practice;
  const q = p.questions[p.index];
  const doneCount = p.questions.filter(x => x.done).length;
  const feedback = q.done ? `
    <div class="feedback-box ${q.selected === q.correctIndex ? 'correct' : 'wrong'}">
      <div class="fb-title">${q.selected === q.correctIndex ? '✅ 回答正确' : '❌ 回答错误'}</div>
      <div>正确答案:${String.fromCharCode(65 + q.correctIndex)}. ${esc(q.options[q.correctIndex])}</div>
      <div style="margin-top:8px;font-size:13.5px">${esc(q.explanation)}</div>
      <div class="fb-actions"><button class="btn btn-sm btn-secondary" id="practice-next">${p.index === p.questions.length - 1 ? '完成练习' : '下一题 →'}</button><button class="btn btn-sm btn-ghost" id="practice-ai">🤖 问 AI 讲解</button></div>
    </div>` : '';
  view.innerHTML = `
    <div class="practice-layout"><div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap"><a class="btn btn-sm btn-ghost" href="#/course/${p.courseId}">← ${course.icon} ${esc(course.name)}</a>${p.kpId ? `<span class="kp-tag">${esc(kpName(course, p.kpId))}</span>` : '<span class="kp-tag">综合练习</span>'}<span style="font-size:13px;color:var(--muted)">已答 ${doneCount}/${p.questions.length}</span></div>
      <div class="card" style="padding:26px">
        <div style="font-size:12px;color:var(--muted);font-weight:600;margin-bottom:8px">第 ${p.index + 1} 题 · ${difficultyText(q.difficulty)}</div>
        <div class="quiz-stem" style="margin-bottom:18px">${esc(q.stem)}</div>
        ${q.options.map((opt, i) => {
          let cls = 'option';
          if (q.done) {
            if (i === q.correctIndex) cls += ' reveal-correct';
            if (i === q.selected && q.selected !== q.correctIndex) cls += ' wrong';
          }
          return `<div class="${cls}" data-index="${i}" ${q.done ? 'style="pointer-events:none"' : ''}><span class="opt-letter">${String.fromCharCode(65 + i)}.</span><span>${esc(opt)}</span></div>`;
        }).join('')}
        ${!q.done ? '<button class="btn btn-block" id="practice-submit" disabled>提交答案</button>' : feedback}
      </div></div>
      <div><div class="card" style="position:sticky;top:20px"><div style="font-weight:700;margin-bottom:12px">答题进度</div>
        <div class="qnav">${p.questions.map((qq, i) => `<button class="${qq.done ? (qq.selected === qq.correctIndex ? 'done-correct' : 'done-wrong') : ''} ${i === p.index ? 'current' : ''}" data-i="${i}">${i + 1}</button>`).join('')}</div>
        <div style="margin-top:14px;font-size:12.5px;color:var(--muted)">答错的题会计入薄弱知识点统计,建议结合 AI 出题做专项强化。</div></div></div>
    </div>`;

  if (!q.done) {
    let selected = null;
    view.querySelectorAll('.option').forEach(el => {
      el.onclick = () => {
        view.querySelectorAll('.option').forEach(x => x.classList.remove('selected'));
        el.classList.add('selected');
        selected = Number(el.dataset.index);
        document.getElementById('practice-submit').disabled = false;
      };
    });
    document.getElementById('practice-submit').onclick = () => {
      q.selected = selected;
      q.done = true;
      recordPractice(q);
      renderPracticeQuestion(view, course);
    };
  } else {
    document.getElementById('practice-next').onclick = () => {
      if (p.index === p.questions.length - 1) {
        toast('练习完成!继续加油 💪', 'success');
        location.hash = p.kpId ? '#/course/' + p.courseId : '#/dashboard';
      } else { p.index++; renderPracticeQuestion(view, course); }
    };
    document.getElementById('practice-ai').onclick = () => location.hash = '#/tutor?course=' + p.courseId + '&q=' + encodeURIComponent(q.stem);
  }
  view.querySelectorAll('.qnav button').forEach(b => { b.onclick = () => { p.index = Number(b.dataset.i); renderPracticeQuestion(view, course); }; });
}

function recordPractice(q) {
  const data = userData();
  data.practice = data.practice || [];
  data.practice.push({ questionId: q.id, selected: q.selected, correct: q.selected === q.correctIndex, kpIds: q.kpIds, answeredAt: new Date().toISOString() });
  saveUserData(data);
}

function renderAiQuestionCard(q) {

function bindAiReveals(scope) {
  scope.querySelectorAll('.ai-question').forEach(card => {

    btn.onclick = () => {
      const ci = card.dataset.correctIndex;
      card.querySelectorAll('.ai-opt').forEach((o, i) => o.classList.toggle('correct-opt', ci !== '' && i === Number(ci)));

      btn.textContent = '已展示解析';
      btn.disabled = true;
    };
  });
}

/* ================= AI 讲题 ================= */
function renderTutorPage(view) {
  const params = new URLSearchParams(location.hash.split('?')[1] || '');
  const preCourse = Number(params.get('course') || state.courses[0].id);
  const preQ = params.get('q') || '';
  const history = [];
  view.innerHTML = `
    <div class="ai-intro"><h3>💬 AI 讲题 · 苏格拉底式引导</h3><p>不直接给答案,而是像学长学姐一样一步步提问引导你思考。贴入题目或描述疑问,开始对话。</p></div>
    <div class="chat-layout"><div>
      <div class="card" style="padding:14px"><div style="font-weight:700;font-size:13px;margin-bottom:10px">当前课程</div>
        <div class="chat-courses">${state.courses.map(c => `<button class="course-opt ${c.id === preCourse ? 'active' : ''}" data-id="${c.id}">${c.icon} ${esc(c.name)}</button>`).join('')}</div>
        <div class="socratic-note">💡 提问时尽量给出题目条件;卡住时可以告诉它"我实在想不出来,请逐步讲解"。</div></div></div>
      <div class="chat-box"><div class="chat-msgs" id="chat-msgs"><div class="msg ai">你好,我是你的 AI 学习伙伴 👋<br>把题目或不懂的知识点发给我,我会引导你一步步想明白。</div></div>
        <div class="chat-input-row"><textarea id="chat-input" placeholder="输入题目或问题,Enter 发送,Shift+Enter 换行"></textarea><button class="btn" id="chat-send">发送</button></div></div>
    </div>`;
  let currentCourse = preCourse;
  view.querySelectorAll('.course-opt').forEach(b => {
    b.onclick = () => { view.querySelectorAll('.course-opt').forEach(x => x.classList.remove('active')); b.classList.add('active'); currentCourse = Number(b.dataset.id); };
  });
  const msgs = document.getElementById('chat-msgs');
  const input = document.getElementById('chat-input');
  if (preQ) input.value = preQ;
  const appendMsg = (text, role) => {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  };
  const doSend = async () => {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    appendMsg(text, 'user');
    history.push({ role: 'user', content: text });
    const loading = appendMsg('AI 思考中…', 'loading');
    try {
      const course = state.courses.find(c => c.id === currentCourse);
      const reply = await DeepSeekClient.tutor({ courseName: course.name, question: '', history });
      loading.remove();
      appendMsg(reply, 'ai');
      history.push({ role: 'assistant', content: reply });
    } catch (e) {
      loading.remove();
      appendMsg('⚠️ ' + e.message, 'ai');
    }
  };
  document.getElementById('chat-send').onclick = doSend;
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); } });
}

      <p>选择课程与题数,DeepSeek 依据课程大纲自动组卷。建议完成诊断后再生成,AI 会更侧重你的薄弱知识点。</p>
      <div class="exam-config">
        <div class="grid grid-2"><div class="field"><label>课程</label><select class="select" id="exam-course">${state.courses.map(c => `<option value="${c.id}">${c.icon} ${esc(c.name)}</option>`).join('')}</select></div>
        <div class="field"><label>题数</label><select class="select" id="exam-count"><option value="5">5 题(快速)</option><option value="10" selected>10 题(标准)</option><option value="15">15 题(强化)</option></select></div></div>
        <div class="field"><label>侧重薄弱点 <span style="font-weight:400;color:var(--muted)">(可选,默认自动)</span></label><div id="exam-kps" style="display:flex;gap:8px;flex-wrap:wrap"></div></div>
        <button class="btn btn-block" id="exam-generate">✨ 生成模拟卷</button>
        ${!state.aiStatus.configured ? '<div style="margin-top:10px;font-size:12.5px;color:var(--amber)">⚠️ 未配置 DeepSeek API Key,将生成内置演示卷。</div>' : ''}
      </div></div>
    <div id="exam-result" style="margin-top:18px"></div>`;
  const kpBox = document.getElementById('exam-kps');
  const refreshKps = () => {
    const course = state.courses.find(c => c.id === Number(document.getElementById('exam-course').value));
    kpBox.innerHTML = (course.kps || []).map(k => `<label style="display:inline-flex;align-items:center;gap:5px;font-size:12.5px;background:var(--gray-soft);padding:5px 10px;border-radius:999px;cursor:pointer"><input type="checkbox" value="${k.id}"> ${esc(k.name)}</label>`).join('');
  };
  document.getElementById('exam-course').onchange = refreshKps;
  refreshKps();
  document.getElementById('exam-generate').onclick = async () => {
    const btn = document.getElementById('exam-generate');
    const box = document.getElementById('exam-result');
    btn.disabled = true; btn.textContent = '📝 组卷中,约需 15-40 秒…';
    box.innerHTML = '<div class="loading-block"><div class="spinner"></div>DeepSeek 正在为你生成模拟卷…</div>';
    try {
      const cid = Number(document.getElementById('exam-course').value);
      const course = state.courses.find(c => c.id === cid);
      const kpIds = Array.from(document.querySelectorAll('#exam-kps input:checked')).map(i => Number(i.value));
      const kpNames = kpIds.map(id => course.kps.find(k => k.id === id)?.name).filter(Boolean);
      const questions = await DeepSeekClient.generateMockExam({ courseName: course.name, courseOutline: course.outline, kpNames, count: Number(document.getElementById('exam-count').value) });
      box.innerHTML = `<div class="card" style="padding:8px 8px 18px">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0;flex-wrap:wrap;gap:8px"><div style="font-weight:800;font-size:17px">📝 ${esc(course.name)} 考前模拟卷(${questions.length} 题)</div><button class="btn btn-sm btn-secondary" id="exam-regen">↻ 重出卷</button></div>
        <div style="padding:0 16px">${questions.map(renderAiQuestionCard).join('')}</div></div>`;
      document.getElementById('exam-regen').onclick = () => document.getElementById('exam-generate').click();
      bindAiReveals(box);
      box.scrollIntoView({ behavior: 'smooth' });
    } catch (e) {
      box.innerHTML = `<div class="empty"><div class="emoji">⚠️</div><div>${esc(e.message)}</div></div>`;
    } finally {
      btn.disabled = false; btn.textContent = '✨ 生成模拟卷';
    }
  };
}

/* ================= 工具 ================= */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function difficultyText(d) { return ({ easy: '基础', medium: '中等', hard: '较难' })[d] || '中等'; }
function fmtTime(iso) { return String(iso || '').replace('T', ' ').slice(0, 16); }
function esc(str) { return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function toast(message, type) {
  const root = document.getElementById('toast-root');
  if (!root) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = message;
  root.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 350); }, 3000);
}
